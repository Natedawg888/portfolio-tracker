name: Deploy (stub)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-from-main (gated stub)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy stub
        run: |
          echo "Deploy from main is gated."
          echo "No host secrets configured yet — skipping real deploy."
          echo "Artifact build succeeded; wire hosting secrets to enable deploy."
