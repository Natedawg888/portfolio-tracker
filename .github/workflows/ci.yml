name: CI

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha]
  workflow_dispatch:

jobs:
  build:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      # Every test file, several at a time; the suite list lives in scripts/run-tests.mjs.
      - run: npm run test:ci
      - run: npm run build
