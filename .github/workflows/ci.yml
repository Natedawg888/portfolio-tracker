name: CI

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha]
  workflow_dispatch:

jobs:
  build:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm run test:metals
      - run: npm run test:cash-sync
      - run: npm run test:prod-routing
      - run: npm run test:dividends
      - run: npm run build
