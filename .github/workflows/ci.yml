name: CI

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha]
  workflow_dispatch:

jobs:
  build:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm run test:metals
      - run: npm run test:cash-sync
      - run: npm run test:prod-routing
      - run: npm run test:isolation
      - run: npm run test:dividends
      - run: npm run test:home-snapshot
      - run: npm run test:savings-goals
      - run: npm run test:page-cache
      - run: npm run test:dashboard
      - run: npm run test:budget
      - run: npm run test:debts
      - run: npm run test:portfolio
      - run: npm run test:kiwisaver
      - run: npm run test:donations
      - run: npm run test:projections
      - run: npm run test:projections-page
      - run: npm run test:net-worth-crypto
      - run: npm run test:2fa
      - run: npm run test:wallets
      - run: npm run test:chain
      - run: npm run build
