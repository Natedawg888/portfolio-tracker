# Railway — https://railway.app
# 1) New project → Deploy from GitHub → Natedawg888/portfolio-tracker → branch alpha (or main later)
# 2) Settings → Root Directory: (repo root)
# 3) Add volume mounted at /app/data (keeps sql.js SQLite across deploys)
# 4) Variables: paste from .env.production.example (never commit real secrets)
# 5) Generate domain; set AKAHU_REDIRECT_URI / AKAHU_FRONTEND_URL / COOKIE_SECURE=true / PUBLIC_URL

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
